name: Stage release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.15.0 --registry=https://registry.npmjs.org
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}` || !/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error("Release tag must match the stable package version");
            }
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:storybook
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the tarball to publish
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/mantine-ai-elements.tgz
        run: pnpm verify:package
      - name: Check whether this exact package is already published
        id: publication
        env:
          PACKAGE_TARBALL: ${{ runner.temp }}/mantine-ai-elements.tgz
        run: node scripts/publication-status.mjs
      - name: Stage verified tarball for maintainer approval
        if: steps.publication.outputs.publish == 'true'
        env:
          PACKAGE_TARBALL: ${{ runner.temp }}/mantine-ai-elements.tgz
        run: npm stage publish "$PACKAGE_TARBALL" --access public --registry=https://registry.npmjs.org
      - name: Explain approval step
        if: steps.publication.outputs.publish == 'true'
        run: |
          echo 'The verified package is staged, not publicly released. Review it in npmjs.com Staged Packages and approve with 2FA.' >> "$GITHUB_STEP_SUMMARY"
