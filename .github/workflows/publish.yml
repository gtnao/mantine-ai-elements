name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}` || !/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error("Release tag must match the stable package version");
            }
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:storybook
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the tarball to publish
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/mantine-ai-elements.tgz
        run: pnpm verify:package
      - name: Check whether this exact package is already published
        id: publication
        env:
          PACKAGE_TARBALL: ${{ runner.temp }}/mantine-ai-elements.tgz
        run: node scripts/publication-status.mjs
      - name: Publish with npm trusted publishing
        if: steps.publication.outputs.publish == 'true'
        env:
          PACKAGE_TARBALL: ${{ runner.temp }}/mantine-ai-elements.tgz
        run: npm publish "$PACKAGE_TARBALL" --access public --registry=https://registry.npmjs.org
